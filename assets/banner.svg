<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">When Models Misread Ink</title>
  <desc id="desc">A decorative banner for a paper auditing VLMs on Arabic calligraphy recognition.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1B1208"/>
      <stop offset="50%" stop-color="#4A2604"/>
      <stop offset="100%" stop-color="#7A3E05"/>
    </linearGradient>
    <linearGradient id="ink" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFF0C2"/>
      <stop offset="100%" stop-color="#E8B84E"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.30"/>
    </filter>
  </defs>
  <rect width="1200" height="360" rx="34" fill="url(#bg)"/>
  <circle cx="1050" cy="74" r="190" fill="#FFFFFF" opacity="0.05"/>
  <circle cx="156" cy="312" r="220" fill="#FFFFFF" opacity="0.035"/>
  <g opacity="0.16" stroke="#FFD675" stroke-width="2" fill="none">
    <path d="M0 80 C160 130, 280 30, 430 90 S720 150, 890 80 S1100 30, 1200 82"/>
    <path d="M0 282 C160 232, 280 332, 430 272 S720 212, 890 282 S1100 332, 1200 280"/>
  </g>
  <g transform="translate(92 76)" filter="url(#shadow)">
    <rect width="250" height="210" rx="26" fill="#FFFFFF" opacity="0.10" stroke="#FFD675" stroke-width="2"/>
    <path d="M58 144 C80 76, 148 52, 184 88 C214 118, 190 168, 132 166 C86 164, 76 132, 112 112 C143 94, 172 112, 158 140" fill="none" stroke="url(#ink)" stroke-width="18" stroke-linecap="round"/>
    <path d="M62 178 C102 192, 164 194, 206 176" fill="none" stroke="url(#ink)" stroke-width="10" stroke-linecap="round" opacity="0.92"/>
  </g>
  <text x="386" y="124" fill="#FFFFFF" font-family="Georgia, 'Times New Roman', serif" font-size="54" font-weight="700">When Models Misread Ink</text>
  <text x="388" y="178" fill="#FFD675" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="28" font-weight="700">Auditing VLMs for Arabic calligraphy recognition</text>
  <text x="390" y="226" fill="#F6E7C6" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="23">script styles • prompt interventions • label collapse • cultural visual evaluation</text>
  <g transform="translate(390 258)">
    <rect width="214" height="42" rx="21" fill="#FFD675" opacity="0.16" stroke="#FFD675"/>
    <text x="24" y="28" fill="#FFD675" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="18" font-weight="700">MusiML @ NeurIPS 2026</text>
  </g>
</svg>
